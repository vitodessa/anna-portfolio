  --border-light:rgba(0,0,0,.1);
  --border-mid:rgba(0,0,0,.18);
  --radius-md:8px;
  --radius-lg:12px;

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-secondary);color:var(--text-primary);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
h1,h2,h3,p{margin:0}
a{color:var(--link-color)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--link-color);outline-offset:2px;border-radius:var(--radius-md)}
.wrap{max-width:960px;margin:0 auto;padding-inline:24px;padding-block:0}

/* hero */
.hero{text-align:center;padding:56px 0 40px}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;margin:0 auto 18px;border:1px solid var(--border-light)}
.hero-label{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px}
.hero-title{font-family:'Playfair Display',Georgia,serif;font-size:42px;font-weight:500;line-height:1.15;margin-bottom:8px;text-wrap:balance}
.hero-sub{font-size:16px;color:var(--text-secondary);max-width:56ch;margin:0 auto;text-wrap:balance}
.hero-stats{display:flex;justify-content:center;gap:48px;margin-top:32px}
.stat-num{font-size:32px;font-weight:500;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:11px;color:var(--text-secondary);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.hero-cta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:28px}
.btn{font-family:inherit;font-size:13px;font-weight:500;padding:8px 16px;border-radius:var(--radius-md);border:1px solid var(--text-primary);text-decoration:none;color:var(--text-primary);background:transparent;transition:background .15s,color .15s}
.btn.primary{background:var(--text-primary);color:var(--bg-primary)}
.btn:hover{background:var(--text-primary);color:var(--bg-primary)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:40px}
.tab{font-family:inherit;font-size:13px;padding:7px 16px;border-radius:var(--radius-md);border:1px solid var(--border-light);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab:hover{border-color:var(--border-mid);color:var(--text-primary)}
.tab.active{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary)}
.tab .cnt{font-size:11px;opacity:.55;margin-left:5px}

/* sections */
.section{margin-bottom:40px}
.section-hdr{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;margin-bottom:6px}
.section-title{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:500}
.section-badge{font-size:11px;padding:3px 11px;border-radius:var(--radius-md);font-weight:500}
.section-note{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

/* link cards (real projects with a URL) */
.card{background:var(--bg-primary);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:16px 18px;text-decoration:none;display:block;position:relative;transition:border-color .15s,transform .15s,box-shadow .15s;min-height:72px;color:inherit}
.card:hover{border-color:var(--border-mid);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.card-domain{font-size:14px;font-weight:500;color:var(--text-primary);word-break:break-word;line-height:1.3;padding-right:20px}
.card-desc{font-size:12px;color:var(--text-secondary);margin-top:5px;line-height:1.4}
.card-arrow{position:absolute;top:14px;right:16px;font-size:13px;color:var(--text-secondary);opacity:0;transition:opacity .15s}
.card:hover .card-arrow{opacity:1}

/* case cards (expandable) */
.case-card{background:var(--bg-primary);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:0;margin-bottom:10px;transition:border-color .15s}
.case-card:hover{border-color:var(--border-mid)}
.case-card summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.case-card summary::-webkit-details-marker{display:none}
.case-title{font-size:15px;font-weight:500;line-height:1.45}
.case-tags{display:flex;flex-wrap:wrap;gap:6px}
.case-tag{font-size:11px;padding:3px 10px;border-radius:var(--radius-md);font-weight:500}
.case-link{font-size:13px;color:var(--link-color);font-weight:500}
.case-card[open] .case-link .when-closed{display:none}
.case-card:not([open]) .case-link .when-open{display:none}
.case-body{padding:0 20px 20px;border-top:1px solid var(--border-light);margin-top:-2px}
.case-body dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 16px;margin:0;padding-top:16px}
.case-body dt{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-secondary);padding-top:3px}
.case-body dd{margin:0;font-size:14px;color:var(--text-primary);line-height:1.55}
.case-body dd.soft{color:var(--text-secondary)}
.case-media{display:grid;gap:10px;margin-top:16px}
.case-media img{width:100%;display:block;border:1px solid var(--border-light);border-radius:var(--radius-md)}
.case-ext{display:inline-block;margin-top:14px;font-size:13px;font-weight:500;color:var(--link-color);text-decoration:none}
.case-ext:hover{text-decoration:underline}

/* badge colours */
.b-purple{background:var(--b-purple-bg);color:var(--b-purple-fg)}
.b-teal{background:var(--b-teal-bg);color:var(--b-teal-fg)}
.b-coral{background:var(--b-coral-bg);color:var(--b-coral-fg)}
.b-blue{background:var(--b-blue-bg);color:var(--b-blue-fg)}
.b-green{background:var(--b-green-bg);color:var(--b-green-fg)}
.b-amber{background:var(--b-amber-bg);color:var(--b-amber-fg)}
.b-gray{background:var(--b-gray-bg);color:var(--b-gray-fg)}

/* offer strip + about + footer */
.offer{background:var(--bg-primary);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:22px 24px;margin-top:8px}
.offer-title{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:500;margin-bottom:6px}
.offer-sub{font-size:14px;color:var(--text-secondary);margin-bottom:14px;max-width:60ch}
.offer-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.offer-item{border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 14px;background:var(--bg-secondary)}
.offer-item b{display:block;font-weight:500;font-size:14px;margin-bottom:3px}
.offer-item span{font-size:12px;color:var(--text-secondary);line-height:1.4;display:block}
.offer-item em{font-style:normal;font-size:11px;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;display:block;margin-top:8px}
.about{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px 40px}
.about h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:8px;font-weight:500}
.about p{font-size:14px;color:var(--text-primary);line-height:1.55}
.about p+p{margin-top:8px}
.footer{text-align:center;padding:40px 0 40px;border-top:1px solid var(--border-light);margin-top:40px}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 24px;margin-bottom:10px}
.footer-links a{font-size:14px;font-weight:500;text-decoration:none}
.footer-links a:hover{text-decoration:underline}
.footer-text{font-size:13px;color:var(--text-secondary)}

.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}.card,.tab{transition:none}}
@media(max-width:600px){
  .hero{padding:40px 0 32px}.hero-title{font-size:30px}.hero-stats{gap:28px}.stat-num{font-size:26px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}.tabs{gap:6px}.tab{font-size:12px;padding:6px 12px}
  .case-body dl{grid-template-columns:1fr;gap:2px 0}.case-body dt{padding-top:10px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}

/* language switcher */
.lang{position:absolute;top:14px;right:0;display:flex;gap:4px}
.lang button{font-family:inherit;font-size:12px;font-weight:500;padding:5px 9px;border-radius:var(--radius-md);border:1px solid var(--border-light);background:transparent;color:var(--text-secondary);cursor:pointer;letter-spacing:.5px}
.lang button:hover{border-color:var(--border-mid);color:var(--text-primary)}
.lang button.active{background:var(--text-primary);color:var(--bg-primary);border-color:var(--text-primary)}
.wrap{position:relative}
@media(max-width:600px){.lang{top:8px}}
</style>

/* ====================== аналитика: события в dataLayer ====================== */
const track = (event, data) => { try { window.dataLayer.push(Object.assign({ event }, data)); } catch (e) {} };

/* ====================== рендер ====================== */
const LANGS = ['ru', 'uk', 'en'];
let L = 'ru';
const t = v => (v && typeof v === 'object') ? (v[L] ?? v.ru ?? '') : (v ?? '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n, forms) {
  if (L === 'en') return n + ' ' + (n === 1 ? forms[0] : forms[1]);
  const m10 = n % 10, m100 = n % 100;
  return n + ' ' + (m10 === 1 && m100 !== 11 ? forms[0] : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? forms[1] : forms[2]);
}

const real = PROJECTS.filter(p => p.kind === 'real');
const study = PROJECTS.filter(p => p.kind === 'study');
const dirsUsed = Object.keys(DIRS).filter(k => PROJECTS.some(p => p.dir === k));
let currentFilter = 'all';

function renderCard(p) {
  const tag = `<span class="case-tag ${DIRS[p.dir].badge}">${esc(t(DIRS[p.dir].title))}</span>` +
              (p.kind === 'study' ? `<span class="case-tag b-gray">${esc(t(UI.studyTag))}</span>` : (p.client ? `<span class="case-tag b-gray">${esc(t(p.client))}</span>` : ''));
  const hasBody = p.task || p.did || p.tools || p.result;
  if (p.url && !hasBody) {
    return `<a class="card" data-track="case_link" data-title="${esc(t(p.title))}" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="card-domain">${esc(t(p.title))}</div><div class="card-desc">${esc(t(p.desc))}</div><span class="card-arrow">↗</span></a>`;
  }
  const rows = [[UI.task, p.task], [UI.did, p.did], [UI.tools, p.tools, 'soft'], [UI.result, p.result]]
    .filter(([, v]) => v).map(([k, v, cls]) => `<dt>${esc(t(k))}</dt><dd class="${cls || ''}">${esc(t(v))}</dd>`).join('');
  const media = p.imgs && p.imgs.length ? `<div class="case-media">${p.imgs.map(i => `<img src="${esc(i.src)}" alt="${esc(t(i.alt) || t(p.title))}" loading="lazy">`).join('')}</div>` : '';
  const ext = p.url ? `<a class="case-ext" data-track="case_link" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(t(UI.open))}</a>` : '';
  return `<details class="case-card" data-title="${esc(t(p.title))}" data-dir="${esc(p.dir)}"><summary><div class="case-title">${esc(t(p.title))}</div><div class="case-tags">${tag}</div><span class="case-link"><span class="when-closed">${esc(t(UI.more))}</span><span class="when-open">${esc(t(UI.less))}</span></span></summary><div class="case-body"><dl>${rows}</dl>${media}${ext}</div></details>`;
}

function renderSection(title, badge, badgeText, items, asGrid) {
  return `<div class="section fade-in"><div class="section-hdr"><h2 class="section-title">${esc(title)}</h2><span class="section-badge ${badge}">${esc(badgeText)}</span></div>` +
         (asGrid ? `<div class="grid">${items.map(renderCard).join('')}</div>` : items.map(renderCard).join('')) + `</div>`;
}

function renderContent() {
  const out = [];
  const inDir = p => currentFilter === 'all' || p.dir === currentFilter;
  const r = real.filter(inDir);
  if (r.length) out.push(renderSection(t(UI.projects), 'b-gray', plural(r.length, UI.pluralProj[L]), r, r.every(p => p.url && !(p.task || p.did))));
  for (const k of dirsUsed) {
    if (currentFilter !== 'all' && currentFilter !== k) continue;
    const items = study.filter(p => p.dir === k);
    if (!items.length) continue;
    out.push(renderSection(t(DIRS[k].title), DIRS[k].badge, plural(items.length, UI.pluralStudy[L]), items, false));
  }
  document.getElementById('content').innerHTML = out.join('');
}

function renderStatic() {
  document.documentElement.lang = L === 'uk' ? 'uk' : L;
  document.title = t(UI.title);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(UI[el.dataset.i18n]); });
  document.getElementById('btnMail').href = 'mailto:annodessa2016@icloud.com?subject=' + encodeURIComponent(t(UI.mailSubj));
  document.getElementById('stats').innerHTML = [
    [real.length, UI.statProjects], [dirsUsed.length, UI.statDirs], [study.length, UI.statStudy],
  ].filter(([n]) => n > 0).map(([n, l]) => `<div class="stat-box"><div class="stat-num">${n}</div><div class="stat-lbl">${esc(t(l))}</div></div>`).join('');
  const tabs = [['all', t(UI.all), PROJECTS.length], ...dirsUsed.map(k => [k, t(DIRS[k].title), PROJECTS.filter(p => p.dir === k).length])];
  document.getElementById('tabs').innerHTML = tabs.map(([id, tt, n]) => `<button class="tab${id === currentFilter ? ' active' : ''}" data-id="${id}" type="button">${esc(tt)}<span class="cnt">${n}</span></button>`).join('');
  document.getElementById('offers').innerHTML = OFFERS.map(o => `<div class="offer-item"><b>${esc(t(o.t))}</b><span>${esc(t(o.d))}</span><em>${esc(t(o.term))}</em></div>`).join('');
  document.getElementById('about').innerHTML = ABOUT.map(a => `<div><h3>${esc(t(a.h))}</h3>${a.p.map(p => `<p>${esc(t(p))}</p>`).join('')}</div>`).join('');
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === L));
}

function setLang(l, remember) {
  if (!LANGS.includes(l)) return;
  L = l;
  if (remember) { try { localStorage.setItem('lang', l); } catch (e) {} }
  renderStatic(); renderContent();
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  currentFilter = b.dataset.id;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('active', x === b));
  renderContent();
  track('filter_click', { filter: currentFilter });
});
document.getElementById('content').addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.case-card') || !d.open) return;
  track('case_open', { case_title: d.dataset.title, case_dir: d.dataset.dir });
}, true);
document.getElementById('content').addEventListener('click', e => {
  const a = e.target.closest('a[data-track="case_link"]'); if (!a) return;
  const d = a.closest('details.case-card');
  track('case_link_click', { case_title: d ? d.dataset.title : a.dataset.title, link_url: a.href });
});
document.querySelectorAll('.hero-cta a, .footer-links a').forEach(a => a.addEventListener('click', () => {
  track('contact_click', { contact_type: a.href.startsWith('mailto:') ? 'email' : 'linkedin' });
}));
document.getElementById('lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setLang(b.dataset.lang, true);
  track('lang_switch', { lang: b.dataset.lang });
  const u = new URL(location.href); u.searchParams.set('lang', b.dataset.lang); history.replaceState(null, '', u);
});

/* стартовый язык: ?lang= → сохранённый → язык браузера → en */
(function () {
  const q = new URLSearchParams(location.search).get('lang');
  let saved = null; try { saved = localStorage.getItem('lang'); } catch (e) {}
  const nav = (navigator.language || '').toLowerCase();
  const guess = nav.startsWith('uk') ? 'uk' : nav.startsWith('ru') ? 'ru' : 'en';
  setLang(LANGS.includes(q) ? q : (LANGS.includes(saved) ? saved : guess), false);
})();
</script>
